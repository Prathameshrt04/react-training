<!DOCTYPE html>
<html>

<head>
    <title>React Basics</title>
    <style>
        .btn {
            margin-left: 5px;
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 7px;
            border-width: 0;
            color: white;
            cursor: pointer;
            background-color: rgb(0, 123, 255);
        }

        .input-container {
            display: flex;
            flex-direction: column;
            max-width: 300px;
        }

        .input-ele {
            margin-top: 5px;
            margin-bottom: 5px;
            padding: 10px 15px;
            border-radius: 5px;
            border-width: 1px;
            min-width: 200px;
            max-width: 200px;
        }

        .btn-show {
            margin-left: 5px;
            padding: 10px 13px;
            border-radius: 7px;
            border-width: 0;
            color: white;
            cursor: pointer;
            background-color: rgb(0, 123, 255);
        }
    </style>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function Header() {
            return (
                <div>
                    <h1>
                        Hello, Welcome to my website
                    </h1>
                </div>
            )
        }

        function Inputs() {

            const [showPassword, setShowPassword] = React.useState(false);

            function updateShowBtn() {
                (
                    showPassword
                        ? setShowPassword(false)
                        : setShowPassword(true)
                )
            }

            return (
                <div
                    className="input-container"
                >
                    <input
                        className="input-ele"
                        type="email"
                        placeholder="Email"
                    />
                    <div>
                        <input
                            className="input-ele"
                            type={
                                showPassword
                                    ? "text"
                                    : "password"
                            }
                            placeholder="Password"
                        />
                        <button
                            className="btn-show"
                            onClick={updateShowBtn}
                        >
                            {
                                showPassword
                                    ? "Hide"
                                    : "Show"
                            }
                        </button>
                    </div>
                </div>
            )
        }

        function Buttons() {
            return (
                <div>
                    <button
                        className="btn"
                    >
                        Login
                    </button>
                    <button
                        className="btn"
                    >
                        Sign Up
                    </button>
                </div>
            )
        }

        function App() {
            return (
                <div>
                    <Header />
                    <Inputs />
                    <Buttons />
                </div>
            );
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
